# Usage
#   Start:              docker compose up
#   With helpers:       docker compose -f docker-compose.yml -f ./dev/docker-compose.dev.yml up
#   Stop:               docker compose down
#   Destroy:            docker compose -f docker-compose.yml -f ./dev/docker-compose.dev.yml down -v --remove-orphans
#   Reset everything:  ./reset.sh

name: supabase

services:
  db:
    image: supabase/postgres:15.1.1.78
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      # ORDEN CRÍTICO: Roles primero, luego esquema
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/00-roles.sql
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/01-jwt.sql
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/02-realtime.sql
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/03-schema.sql
      # Carpeta nueva para ignorar errores pasados
      - ./volumes/db/data_v9:/var/lib/postgresql/data 
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

  meta:
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PORT: 5432
      PG_META_DB_SSL: "false"

  studio:
    image: supabase/studio:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meta:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      SNIPPETS_MANAGEMENT_FOLDER: /etc/studio/snippets
    volumes:
      - ./volumes/studio/snippets:/etc/studio/snippets

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    volumes:
      - ./volumes/api/kong.yml:/home/kong/kong.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

  vector:
    image: timberio/vector:0.28.1-debian
    restart: unless-stopped
    environment:
      VECTOR_LOG: error
    volumes:
      - ./volumes/logs/vector.yml:/etc/vector/vector.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
